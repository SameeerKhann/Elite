<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
<title>Elite Internal</title>
<style>
  :root { --bg:#0b1120; --panel:#131c30; --side:#0e1626; --line:#263349; --text:#e6ebf5; --muted:#93a1b8;
          --input:#0b1322; --accent:#5b68eb; --accent2:#28e1fd; --mine:#3f4fd6; --bubble:#1a2740;
          --active:#1a2740; --bad:#ef4444; --good:#22c55e; }
  :root[data-theme="light"] { --bg:#ffffff; --panel:#ffffff; --side:#f3f6fc; --line:#e3e8f0; --text:#141b2b;
          --muted:#5c6879; --input:#ffffff; --accent:#4f5fe0; --accent2:#0bb6dc; --mine:#4f5fe0; --bubble:#eef2f9; --active:#e7edf9; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
              font-family:system-ui,Segoe UI,Roboto,sans-serif; }
  body { display:flex; height:100vh; }
  .side { width:230px; min-width:230px; background:var(--side); border-right:1px solid var(--line);
          display:flex; flex-direction:column; overflow-y:auto; }
  .side .brand { padding:14px 16px; font-weight:700; font-size:15px; border-bottom:1px solid var(--line); }
  .side .sec { padding:14px 16px 6px; font-size:11px; letter-spacing:.6px; color:var(--muted); text-transform:uppercase; }
  .conv { padding:9px 16px; cursor:pointer; font-size:14px; display:flex; align-items:center; gap:8px; }
  .conv:hover { background:#152241; }
  .conv.active { background:var(--active); border-left:3px solid var(--accent); padding-left:13px; }
  .conv .lbl { flex:1; display:flex; flex-direction:column; gap:1px; overflow:hidden; }
  .conv .name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conv .u { font-size:11px; color:var(--muted); }
  .dot { width:8px; height:8px; border-radius:50%; background:#475569; flex:none; }
  .dot.on { background:var(--good); }
  .badge { background:var(--bad); color:#fff; font-size:11px; font-weight:700; border-radius:999px;
           padding:1px 7px; min-width:19px; text-align:center; flex:none; }
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .main header { padding:13px 18px; border-bottom:1px solid var(--line); background:var(--panel); font-weight:700; font-size:15px; }
  #list { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:72%; padding:8px 12px; border-radius:12px; background:var(--bubble); }
  .msg .who { font-size:11px; color:var(--muted); margin-bottom:3px; }
  .msg .body { font-size:14px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .msg .time { font-size:10px; color:var(--muted); margin-top:4px; text-align:right; }
  .msg.mine { align-self:flex-end; background:var(--mine); color:#fff; }
  .msg.mine .who, .msg.mine .time { color:#dbeafe; }
  .empty { color:var(--muted); text-align:center; margin:auto; font-size:13px; }
  .note { padding:6px 18px; font-size:11px; color:var(--muted); background:var(--panel); }
  form { display:flex; gap:8px; padding:12px 18px; border-top:1px solid var(--line); background:var(--panel); }
  #text { flex:1; resize:none; padding:11px 13px; border-radius:10px; border:1px solid var(--line);
          background:var(--input); color:var(--text); font:inherit; font-size:14px; max-height:120px; }
  #text:focus { outline:2px solid var(--accent); border-color:var(--accent); }
  button.send { border:0; border-radius:10px; background:var(--accent); color:#fff; font-weight:600;
                padding:0 18px; cursor:pointer; font-size:14px; }
  button.send:disabled { opacity:.6; cursor:default; }

  .logo-light-img{display:none}
  :root[data-theme="light"] .logo-dark-img{display:none}
  :root[data-theme="light"] .logo-light-img{display:inline-block}
</style>
</head>
<body>
  <div class="side">
    <div class="brand" style="display:flex;align-items:center;gap:9px">
      <img class="logo-dark-img" src="elite-dark.webp" alt="Elite" style="height:22px;width:auto;border-radius:6px;vertical-align:middle"><img class="logo-light-img" src="elite-light.jpg" alt="Elite" style="height:22px;width:auto;border-radius:6px;vertical-align:middle">
      <span>Elite Internal</span>
    </div>
    <div class="sec">Channel</div>
    <div id="channels"></div>
    <div class="sec">Rooms</div>
    <div id="rooms"></div>
    <div class="sec">Direct messages</div>
    <div id="contacts"><div class="conv"><span class="u">Loading…</span></div></div>
  </div>

  <div class="main">
    <header id="convTitle"># General</header>
    <div id="list"><div class="empty">Loading…</div></div>
    <div class="note">Text only. Messages can't be edited or deleted, and are removed automatically after 7 days.</div>
    <form id="form">
      <textarea id="text" rows="1" placeholder="Type a message…  (Enter to send, Shift+Enter for new line)"></textarea>
      <button class="send" id="send" type="submit">Send</button>
    </form>
  </div>

<script>
  const channelsEl = document.getElementById('channels');
  const roomsEl = document.getElementById('rooms');
  const contactsEl = document.getElementById('contacts');
  const listEl = document.getElementById('list');
  const convTitle = document.getElementById('convTitle');
  const form = document.getElementById('form');
  const textEl = document.getElementById('text');
  const sendBtn = document.getElementById('send');

  let me = { username: '', name: '' };
  let currentTo = 'group';
  let currentLabel = '# General';
  let lastId = 0;
  let seen = false;

  const esc = (s) => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  function fmtTime(iso) {
    try {
      const d = new Date(String(iso).replace(' ', 'T').replace(/Z?$/, 'Z'));
      if (isNaN(d)) return '';
      return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    } catch { return ''; }
  }

  function convRow({ to, name, sub, unread, online }) {
    const el = document.createElement('div');
    el.className = 'conv' + (String(to) === String(currentTo) ? ' active' : '');
    el.dataset.to = to;
    let html = '';
    if (online !== undefined) html += `<span class="dot ${online ? 'on' : ''}"></span>`;
    html += `<span class="lbl"><span class="name">${esc(name)}</span>${sub ? `<span class="u">${esc(sub)}</span>` : ''}</span>`;
    if (unread > 0 && String(to) !== String(currentTo)) html += `<span class="badge">${unread > 99 ? '99+' : unread}</span>`;
    el.innerHTML = html;
    el.addEventListener('click', () => selectConversation(to, name.startsWith('#') ? name : (online !== undefined ? 'Direct message · ' + name : name)));
    return el;
  }

  async function refreshOverview() {
    const ov = await window.chat.overview();
    if (!ov || !ov.ok) return;
    channelsEl.innerHTML = '';
    channelsEl.appendChild(convRow({ to: 'group', name: '# General', sub: 'Everyone', unread: ov.group.unread }));
    roomsEl.innerHTML = ov.rooms.length ? '' : '<div class="conv"><span class="u">No rooms yet</span></div>';
    for (const r of ov.rooms) roomsEl.appendChild(convRow({ to: 'room:' + r.id, name: '🛡 ' + r.name, unread: r.unread }));
    contactsEl.innerHTML = ov.contacts.length ? '' : '<div class="conv"><span class="u">No other employees yet</span></div>';
    for (const c of ov.contacts) contactsEl.appendChild(convRow({ to: c.id, name: c.fullName || c.username, sub: '@' + c.username, unread: c.unread, online: c.online }));

    let total = ov.group.unread + ov.rooms.reduce((s, r) => s + r.unread, 0) + ov.contacts.reduce((s, c) => s + c.unread, 0);
    window.chat.setUnread(total);
  }

  function selectConversation(to, label) {
    currentTo = to; currentLabel = label; lastId = 0; seen = false;
    convTitle.textContent = label;
    listEl.innerHTML = '<div class="empty">Loading…</div>';
    document.querySelectorAll('.conv').forEach(c => c.classList.toggle('active', c.dataset.to !== undefined && String(c.dataset.to) === String(to)));
    textEl.focus();
    window.chat.markRead(to);
    poll().then(refreshOverview);
  }

  function renderMessages(messages, to) {
    if (String(to) !== String(currentTo)) return;
    if (!messages || !messages.length) {
      if (!seen && lastId === 0) listEl.innerHTML = '<div class="empty">No messages yet. Say hello 👋</div>';
      return;
    }
    if (!seen) { listEl.innerHTML = ''; seen = true; }
    const atBottom = listEl.scrollHeight - listEl.scrollTop - listEl.clientHeight < 80;
    let added = false;
    for (const m of messages) {
      if (m.id <= lastId) continue;
      lastId = m.id; added = true;
      const el = document.createElement('div');
      el.className = 'msg' + (m.username === me.username ? ' mine' : '');
      const who = document.createElement('div'); who.className = 'who'; who.textContent = m.username === me.username ? 'You' : m.username;
      const body = document.createElement('div'); body.className = 'body'; body.textContent = m.body;
      const time = document.createElement('div'); time.className = 'time'; time.textContent = fmtTime(m.created_at);
      el.appendChild(who); el.appendChild(body); el.appendChild(time);
      listEl.appendChild(el);
    }
    if (atBottom) listEl.scrollTop = listEl.scrollHeight;
    if (added) window.chat.markRead(currentTo); // messages seen while viewing
  }

  async function poll() {
    const to = currentTo;
    const res = await window.chat.list(to, lastId);
    renderMessages(res && res.messages, to);
  }

  async function sendNow() {
    const t = textEl.value.trim();
    if (!t) return;
    sendBtn.disabled = true;
    textEl.value = '';
    await window.chat.send(currentTo, t);
    await poll();
    sendBtn.disabled = false;
    textEl.focus();
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); sendNow(); });
  textEl.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendNow(); } });

  // Theme — applied from the main process and kept in sync live.
  const applyTheme = (t) => document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
  window.chat.getTheme().then(applyTheme);
  window.chat.onTheme(applyTheme);

  // Adaptive polling to stay light at scale:
  //  • When this chat tab is the one being viewed  -> poll messages every 6s.
  //  • When the agent is on another tab (the usual case) -> no message polling,
  //    just a light unread check every ~20s to keep the tab badge current.
  let active = false;
  window.chat.onActive((a) => {
    active = a;
    if (a) { poll(); refreshOverview(); window.chat.markRead(currentTo); }
  });

  setInterval(() => { if (active) poll(); }, 6000); // messages only while viewing

  (function overviewLoop() {
    setTimeout(async () => { await refreshOverview(); overviewLoop(); }, active ? 9000 : 20000);
  })();

  (async () => {
    me = await window.chat.me();
    await refreshOverview();          // initial badge
    selectConversation('group', '# General');
  })();
</script>
</body>
</html>
