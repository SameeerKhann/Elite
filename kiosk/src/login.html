<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';">
<title>Shift Login</title>
<style>
  :root { --bg:#0b1120; --card:#131c30; --line:#263349; --text:#e6ebf5; --muted:#93a1b8; --input:#0b1322;
          --accent:#5b68eb; --accent2:#28e1fd; --bad:#ef4444; --glow:#16233f; --shadow:rgba(0,0,0,.4);
          --brand-grad:linear-gradient(135deg,#5b68eb,#28e1fd); }
  :root[data-theme="light"] { --bg:#eef1f8; --card:#ffffff; --line:#e3e8f0; --text:#141b2b; --muted:#5c6879;
          --input:#ffffff; --accent:#4f5fe0; --accent2:#0bb6dc; --glow:#dfe6fb; --shadow:rgba(20,30,60,.12); }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; }
  html,body { height:100%; margin:0; }
  body { font-family:system-ui,Segoe UI,Roboto,sans-serif; background:radial-gradient(circle at 50% 30%, var(--glow), var(--bg));
         color:var(--text); display:flex; align-items:center; justify-content:center; }
  .card { width:380px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px; box-shadow:0 20px 60px var(--shadow); }
  .logo { display:flex; align-items:center; justify-content:center; gap:10px; font-weight:700; font-size:20px; margin-bottom:18px; }
  .logo .mark { width:34px; height:34px; border-radius:9px; background:var(--brand-grad); display:flex;
                align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:19px; }
  .logo .grad { background:var(--brand-grad); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1 { font-size:21px; margin:0 0 4px; text-align:center; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:22px; text-align:center; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--line);
          background:var(--input); color:var(--text); font-size:15px; user-select:text; -webkit-user-select:text; }
  input:focus { outline:2px solid var(--accent); border-color:var(--accent); }
  button.primary { width:100%; margin-top:22px; padding:13px; border:0; border-radius:10px; background:var(--brand-grad);
           color:#fff; font-size:16px; font-weight:600; cursor:pointer; }
  button.primary:disabled { opacity:.6; cursor:default; }
  .error { background:rgba(239,68,68,.12); border:1px solid var(--bad); color:var(--bad);
           padding:10px 12px; border-radius:8px; font-size:13px; margin-top:16px; display:none; }
  .foot { margin-top:20px; font-size:11px; color:var(--muted); text-align:center; }
  .exitwrap { margin-top:18px; text-align:center; border-top:1px solid var(--line); padding-top:14px;
              display:flex; align-items:center; justify-content:space-between; }
  .exitlink { color:var(--muted); font-size:12px; text-decoration:none; cursor:pointer; }
  .exitlink:hover { color:var(--text); }
  .themebtn { background:transparent; border:1px solid var(--line); color:var(--muted); border-radius:8px;
              padding:5px 10px; cursor:pointer; font-size:12px; }
  .exitbox { display:none; margin-top:12px; }
  .exitbox input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
                   background:var(--input); color:var(--text); font-size:14px; user-select:text; -webkit-user-select:text; }
  .exitgo { margin-top:8px; width:100%; padding:9px; border:0; border-radius:8px; background:var(--line);
            color:var(--text); font-weight:600; cursor:pointer; }
  .exiterr { color:var(--bad); font-size:12px; margin-top:8px; min-height:14px; }

  .logo-light-img{display:none}
  :root[data-theme="light"] .logo-dark-img{display:none}
  :root[data-theme="light"] .logo-light-img{display:inline-block}
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="off">
    <div class="logo"><img class="logo-dark-img" src="elite-dark.webp" alt="Elite" style="height:34px;width:auto;border-radius:6px;vertical-align:middle"><img class="logo-light-img" src="elite-light.jpg" alt="Elite" style="height:34px;width:auto;border-radius:6px;vertical-align:middle"><span>Elite <span class="grad">Techlogix</span></span></div>
    <h1>Start your shift</h1>
    <div class="sub">Enter your work username and password to begin.</div>
    <label>Username</label>
    <input id="username" type="text" autocomplete="off" autofocus>
    <label>Password</label>
    <input id="password" type="password" autocomplete="off">
    <div class="error" id="error"></div>
    <button id="btn" class="primary" type="submit">Log in &amp; open Dialer</button>
    <div class="foot" id="foot"></div>

    <div class="exitwrap">
      <a href="#" id="exitLink" class="exitlink">Close kiosk</a>
      <button type="button" id="themeBtn" class="themebtn">Theme</button>
    </div>
    <div id="exitBox" class="exitbox">
      <input id="exitCode" type="password" placeholder="Enter exit code" autocomplete="off">
      <button type="button" id="exitBtn" class="exitgo">Close</button>
      <div class="exiterr" id="exitErr"></div>
    </div>
  </form>

<script>
  const form = document.getElementById('form');
  const btn = document.getElementById('btn');
  const errBox = document.getElementById('error');

  window.kiosk.info().then(i => {
    document.getElementById('foot').textContent = 'Machine: ' + i.machineId;
  });

  // Theme (dark/light), synced across all kiosk screens via the main process.
  const themeBtn = document.getElementById('themeBtn');
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
    themeBtn.textContent = t === 'light' ? '🌙 Dark' : '☀ Light';
  }
  window.kiosk.getTheme().then(applyTheme);
  window.kiosk.onTheme(applyTheme);
  themeBtn.addEventListener('click', () => {
    const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    window.kiosk.setTheme(next);
  });

  // Ensure the username field is focused when returning here after logout.
  function focusUser() { try { document.getElementById('username').focus(); } catch {} }
  window.addEventListener('load', focusUser);
  window.addEventListener('focus', focusUser);
  focusUser();

  // Visible "Close kiosk" option: reveal a code box; correct code closes the app.
  const exitLink = document.getElementById('exitLink');
  const exitBox = document.getElementById('exitBox');
  const exitCode = document.getElementById('exitCode');
  const exitBtn = document.getElementById('exitBtn');
  const exitErr = document.getElementById('exitErr');
  exitLink.addEventListener('click', (e) => {
    e.preventDefault();
    exitBox.style.display = 'block';
    exitCode.focus();
  });
  function tryExit() {
    if (exitCode.value === 'closeelite99') { window.kiosk.exit(); }
    else { exitErr.textContent = 'Incorrect code.'; exitCode.value = ''; exitCode.focus(); }
  }
  exitBtn.addEventListener('click', tryExit);
  exitCode.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); tryExit(); } });

  // (Also still works as an invisible shortcut: type the code anywhere.)
  let codeBuf = '';
  window.addEventListener('keydown', (e) => {
    if (e.key && e.key.length === 1) codeBuf = (codeBuf + e.key).slice(-32);
    if (codeBuf.toLowerCase().endsWith('closeelite99')) { codeBuf = ''; window.kiosk.exit(); }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.style.display = 'none';
    const u = document.getElementById('username').value.trim();
    const p = document.getElementById('password').value;
    if (!u || !p) { showError('Enter your username and password.'); return; }
    btn.disabled = true; btn.textContent = 'Checking…';
    const res = await window.kiosk.login(u, p);
    if (!res.ok) {
      showError(res.error || 'Login failed.');
      btn.disabled = false; btn.textContent = 'Log in & open Dialer';
    }
    // On success the main process swaps to the Dialer automatically.
  });

  function showError(msg) { errBox.textContent = msg; errBox.style.display = 'block'; }
</script>
</body>
</html>
